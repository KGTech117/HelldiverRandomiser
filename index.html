<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stratagem Randomiser</title>
<meta name="description" content="Rolls a random, 'reasonable' Stratagem loadout.">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div class="stripe" aria-hidden="true"></div>

<header class="masthead">
  <p class="eyebrow">Super Earth Armed Forces &mdash; Strategic Command</p>
  <h1>Stratagem Randomiser</h1>
  <p class="subtitle">Your loadout, determined by your loyal Democracy Officer, Montezuma.</p>
</header>

<main>
  <section class="loadout" id="loadout" aria-label="Rolled loadout"></section>

  <section class="booster is-empty" id="booster" aria-label="Rolled booster">
    <div class="booster__art"><img class="booster__icon" alt="" src="assets/icons/placeholder.svg"></div>
    <div class="booster__text">
      <p class="booster__label">Ship Booster</p>
      <h2 class="booster__name">Awaiting Orders</h2>
      <p class="booster__category">&mdash;</p>
    </div>
  </section>

  <div class="controls">
    <button type="button" id="roll" class="roll-button">
      <span class="roll-button__label">Deploy</span>
    </button>
    <p class="hint"><span id="pool-count">0</span> stratagems and <span id="booster-count">0</span> boosters in the pool &middot; <span id="rules"></span> per loadout.</p>
  </div>

  <p class="visually-hidden" id="status" role="status" aria-live="polite"></p>
</main>

<footer class="footer">
  <p>To add stratagemes or make changes, please ask Monte.</p>
</footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/randomiser.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
